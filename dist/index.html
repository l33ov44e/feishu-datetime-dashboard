<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>飞书仪表盘 - 日期时间插件</title>
    <script>
      function isMobileLark() {
        const ua = window.navigator.userAgent;
        const isLark = /feishu/i.test(ua) || /lark/i.test(ua);
        const isMobile = /mobile|android|iphone|ipad|phone/i.test(ua);
        return isLark && isMobile;
      }
      if (isMobileLark()) {
        // 检测到移动版飞书，重定向到禁用页面
        window.location.href = "./mobile_disable.html";
      }
    </script>
    <script type="module" crossorigin src="./assets/main-5s2b-ybj.js"></script>

</html>
